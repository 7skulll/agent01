[project]
name = "enterprise-langchain-rag"
version = "0.1.0"
description = "Enterprise RAG learning project built with FastAPI and LangChain"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "langchain>=1,<2",
  "langchain-deepseek>=1,<2",
  "langchain-openai>=1,<2",
  "tiktoken>=0.12,<1",
  "langgraph>=1.2.14,<2",
  "pypdf>=6.20.1",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "rjieba==0.1.13",
  "psycopg[binary,pool]>=3.2,<4",
  "langgraph-checkpoint-postgres>=3,<4",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
